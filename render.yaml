# Reviewed deployment template. Import from the Render dashboard; no Docker required.
services:
  - type: web
    name: nexora-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @nexora/api
    startCommand: npm start -w @nexora/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: WEB_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
# AI_API_KEY is optional; add it securely in the backend's environment settings.
