name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  workspace-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start checksum-verified local MongoDB
        run: |
          npm run db:local > /tmp/nexora-db.log 2>&1 &
          for attempt in $(seq 1 60); do
            if node -e "const net=require('net');const s=net.connect(27017,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-db.log
          exit 1
      - run: npm run test:e2e:workspace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-playwright-report
          path: playwright-report/
